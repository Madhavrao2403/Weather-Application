<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Weather App</h1>

    <div class="search-box">
        <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
        >

        <button onclick="getWeather()">
            Search
        </button>
    </div>

    <div id="error"></div>

    <div class="weather-card" id="weatherCard">

        <div class="location">
            <h2 id="cityName">Hyderabad</h2>
            <p id="country">India</p>
        </div>

        <div class="temperature">
            <img id="weatherIcon" src="" alt="Weather">
            <span id="temperature">--</span>
            <span>°C</span>
        </div>

        <p id="description">--</p>

        <div class="details">

            <div class="detail">
                <span>Feels Like</span>
                <strong id="feelsLike">-- °C</strong>
            </div>

            <div class="detail">
                <span>Humidity</span>
                <strong id="humidity">-- %</strong>
            </div>

            <div class="detail">
                <span>Wind</span>
                <strong id="windSpeed">-- km/h</strong>
            </div>

            <div class="detail">
                <span>Pressure</span>
                <strong id="pressure">-- mb</strong>
            </div>

            <div class="detail">
                <span>Visibility</span>
                <strong id="visibility">-- km</strong>
            </div>

            <div class="detail">
                <span>UV Index</span>
                <strong id="uvIndex">--</strong>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
